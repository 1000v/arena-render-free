rc:`${ta}/tild3761-3537-4164-b737-313564313364/-/resize/800x/1128_2_big.jpg`,alt:"Учащиеся ЦДО СГУПС"}],ag=["Межпредметная научно-практическая конференция школьников «Шаг в будущее»","Творческие встречи, литературные и музыкальные конкурсы","Традиционные мероприятия: «Мисс ЦДО», «Богатыри ЦДО», «День отличника», КВН","Водно-спортивный праздник, спартакиада первокурсников, оборонно-спортивная эстафета","19 спортивных секций: стадион, спортивные залы, бассейн","Волонтёрский отряд ЦДО"],ng=[{text:"«Два прекрасных учебных года в ЦДО были лучшими в моей жизни»",name:"Денис Жуков",role:"выпускник 2020 года, золотой медалист, факультет «Управление транспортно-технологическими комплексами»"},{text:"«ЦДО отлично подготовило меня к университетской жизни и направило на верный путь»",name:"Антон Легостаев",role:"выпускник 2018 года, факультет «Бизнес-информатика» СГУПС"},{text:"«ЦДО - лучшее место, для окончания школы»",name:"Егор Галий",role:"выпускник 2018 года, золотой медалист, факультет «Мировая экономика и право»"}],ug=[{q:"Что такое ЦДО СГУПС?",a:"Центр довузовского образования - это школа при университете. Обучение проходит в стенах СГУПС, а вместо уроков у учащихся профильных классов идут пары по вузовской форме: лекции, семинары, проекты."},{q:"Как попасть в 10-й профильный класс?",a:"Нужно закончить 9 классов и успешно пройти контрольные испытания по математике и физике, а также собеседование. Приём документов проходит с 1 апреля в университете (ауд. Л-116), запись на подготовительные курсы открывается с 1 октября."},{q:"Какие документы нужны для зачисления в 10-й класс?",a:"Аттестат (оригинал и копия), личная карта обучающегося из школы с отметкой о выбытии, медицинская карта из школы, копия паспорта в двух экземплярах (первая страница и страница с пропиской), копия СНИЛС, копия медицинского полиса, копия сертификата о прививках, две фотографии 3×4 и электронное фото до 50 КБ для пропуска."},{q:"Сколько стоит обучение?",a:"На программе подготовки к ЕГЭ (11 класс, 4 месяца обучения) стоимость предмета составляет 13 000 ₽. Стоимость остальных программ и уточнение цены - по телефонам ЦДО: +7 (383) 328-04-25, +7 (383) 328-05-50."},{q:"Можно ли заниматься онлайн?",a:"Да. Отдельные предметы доступны online: информатика и обществознание (ЕГЭ), физика, математика профильного уровня и обществознание (ОГЭ). Программа подготовки к ЕГЭ реализуется очно-заочно с применением электронного обучения и информационных технологий."},{q:"Где проходят занятия?",a:"В кампусе СГУПС: г. Новосибирск, ул. Залесского, 1, аудитория Л-116. Профильные 10-е классы работают на базе МОУ СОШ № 100 г. Новосибирска. Почтовый адрес университета: 630049, г. Новосибирск, ул. Дуси Ковальчук, 191."},{q:"Есть ли преимущества при поступлении в СГУПС?",a:"По информации ЦДО, при равенстве баллов приоритет при зачислении отдаётся выпускникам ЦДО, а выпускники часто показывают балл ЕГЭ выше, чем в обычной школе. Также высоки шансы получить целевое обучение от РЖД."},{q:"Остаётся ли время на внеучебную жизнь?",a:"Да. Учащиеся ЦДО участвуют в конференции «Шаг в будущее», КВН, «Мисс ЦДО», «Богатырях ЦДО», гитарных вечерах, спортивных секциях и волонтёрском отряде университета."},{q:"Как записаться?",a:"Позвоните в ЦДО: +7 (383) 328-04-25, +7 (383) 328-05-50, +7 (963) 945-89-09 (MAX) или напишите на cdo@sgups.stu.ru либо fdp@stu.ru. Центр работает с понедельника по пятницу, с 8:30 до 17:30."}],ig=[{label:"Объявление ЦДО СГУПС на stu.ru",href:"https://www.stu.ru/abiturient/announ/index.php?an=3145"},{label:"Правила приёма ЦДО СГУПС",href:"https://www.stu.ru/abiturient/index.php?page=1418"},{label:"Сайт ЦДО СГУПС",href:"http://cdo.sgups.tilda.ws/"},{label:"Приёмная комиссия СГУПС",href:"https://www.stu.ru/"}];function um(f){var g,x,o="";if(typeof f=="string"||typeof f=="number")o+=f;else if(typeof f=="object")if(Array.isArray(f)){var z=f.length;for(g=0;g<z;g++)f[g]&&(x=um(f[g]))&&(o&&(o+=" "),o+=x)}else for(x in f)f[x]&&(o&&(o+=" "),o+=x);return o}function cg(){for(var f,g,x=0,o=
