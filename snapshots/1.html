 записи подтвердите цену, расписание и наличие группы в ЦДО.",source:s0.programs,category:"exam"},{id:"03",title:"Подготовка к ОГЭ",audience:"9 класс",description:"Уверенный старт перед выбором профиля.",subjects:"Математика, физика, обществознание",format:"Очно / онлайн",duration:"2 месяца по опубликованной программе",price:"Стоимость уточняется в ЦДО",detail:"Экспресс-подготовка для учащихся 9-х классов. Инженерный профиль включает математику и физику, социально-экономический профиль: математику и обществознание. В объявлении указаны очный и онлайн-форматы и длительность 2 месяца. Начало ближайшей группы, расписание и стоимость уточняйте в центре.",source:s0.programs,category:"exam"},{id:"04",title:"Вступительные испытания",audience:"Абитуриентам",description:"Подготовка к внутренним экзаменам вуза.",subjects:"Предметы зависят от образования и направления поступления",format:"Дистанционно*",duration:"По выбранной дисциплине",price:"Стоимость уточняется в ЦДО",detail:"На странице заочного факультета опубликованы курсы ЦДО для подготовки к вступительным испытаниям, в том числе для выпускников СПО. Дисциплины зависят от основания поступления. Формат и доступность ближайшего набора, право сдавать внутренние испытания и список предметов необходимо подтвердить в ЦДО и приёмной комиссии.",source:s0.admission,category:"admission"}],Ns=[["Как записаться на обучение?","Выберите программу и свяжитесь с ЦДО по телефону +7 (383) 328-04-25 или напишите на cdo@sgups.stu.ru. Сотрудники подскажут, есть ли места в подходящей группе, и объяснят порядок оформления."],["Какие документы нужны?","Перечень зависит от программы. Актуальный список документов для профильного класса или подготовительных курсов нужно запросить в ЦДО. Не отправляйте сканы документов до согласования со специалистом центра."],["Можно ли заниматься онлайн?","Да. В официальном объявлении онлайн-формат указан для подготовки к ОГЭ по математике, физике и обществознанию, а также для ЕГЭ по информатике и обществознанию. Формат конкретной группы подтвердите при записи."],["Когда начинается обучение?","Дата ближайшего набора требует уточнения в ЦДО. В опубликованной программе предусмотрены двухмесячная экспресс-подготовка к ОГЭ и четырёхмесячная подготовка к ЕГЭ. Они не означают, что запись в группу открыта прямо сейчас."],["Сколько стоит обучение?","В официальном объявлении СГУПС для четырёхмесячной подготовки к ЕГЭ указано 13 000 ₽ за предмет. Период действия тарифа не обозначен. Подтвердите действующую цену перед заключением договора. Стоимость других программ уточняется в ЦДО."],["Где находится ЦДО?","На странице центра указан адрес: Новосибирск, ул. Залесского, 1, аудитория Л-116. Перед визитом уточните время приёма и аудиторию занятий по телефону +7 (383) 328-04-25."],["Гарантирует ли обучение поступление в СГУПС?","Нет. Подготовка помогает изучить предметы и познакомиться с университетской средой, но поступление проходит по действующим правилам приёма СГУПС. Требования и учёт индивидуальных достижений проверяйте на официальном сайте университета."]],O6=[["Программы","programs"],["О центре","about"],["Поступление","journey"],["FAQ","faq"],["Контакты","contacts"]],I0=[{title:"8-9 класс",text:"Выбираешь направление",detail:"Присмотрись к предметам, которые тебе интересны. В 9-м классе можно выбрать подготовку к ОГЭ в ЦДО.",action:"Выбрать программу"},{title:"ЦДО",text:"Начинаешь свой маршрут",detail:"Обсуди с сотрудниками центра свою цель: подготовиться к экзаменам или продолжить обучение в профильном классе.",action:"Выбрать программу"},{title:"ОГЭ",text:"Готовишься к экзаменам",detail:"Подготовка для девятиклассников по математике, физике и обществознанию. Доступны очный и онлайн-форматы.",action:"Выбрать программу"},{title:"10-11 класс",text:"Погружаешься в профиль",detail:"Технологический или социально-экономический профиль. Занятия на базе СГУПС и знакомство с университетской средой.",action:"Выбрать программу"},{title:"ЕГЭ",text:"Систематизируешь знания",detail:"Пять пре
